name: Smoke prod

on:
  schedule:
    # Twice daily (UTC). Soft-fails 429 so free-tier cold starts / RL stay green.
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke against production
        env:
          SMOKE_BASE: https://mcp-legal-chile.onrender.com
        run: node scripts/smoke.mjs
